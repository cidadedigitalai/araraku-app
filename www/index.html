<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ararakú</title>
<link rel="icon" href="arara-azul.webp">
<style>
@font-face{font-family:"Baloo 2";src:url(fontes/Baloo2.woff2) format("woff2");font-weight:400 800;font-display:swap}
@font-face{font-family:"Nunito";src:url(fontes/Nunito.woff2) format("woff2");font-weight:200 1000;font-display:swap}
/* Layout: aconchegante e claro, em tema único — barra de topo (contadores · título + biomas · botões redondos), cartão branco com o tabuleiro de peças arredondadas e uma pílula de status */
:root{
  --bg:#F7F2E7; --card:#FFFFFF; --ink:#4A3A35; --muted:#9A8780; --line:#ECE3D6;
  --dark:#3B2C28; --sun:#F2B705; --bad:#E0525C;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.brandbar{width:100%;flex-shrink:0;max-width:860px;margin:0 auto 12px;display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brandbar .logo{width:38px;height:38px;border-radius:10px;background:var(--card);box-shadow:0 1px 4px rgba(74,58,53,.12);display:grid;place-items:center}
.brandbar .logo svg{width:32px;height:32px}
.brandbar b{font:800 17px/1 var(--f-display);display:block;color:var(--dark)}
.brandbar small{font-size:11.5px;color:#B0715F;font-weight:700}

.top{width:100%;flex-shrink:0;max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.left{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(74,58,53,.10);font:800 17px var(--f-body);font-variant-numeric:tabular-nums}
.pill svg{width:30px;height:30px}
.pill .num{color:#3E9A57}
.pill.lives{padding:8px 12px;gap:3px}
.pill.lives svg{width:22px;height:22px;transition:opacity .3s,transform .3s}
.pill.lives svg.gone{opacity:.2;transform:scale(.75)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
h1{font:800 34px/1.05 var(--f-display);margin:0;color:var(--dark);text-wrap:balance}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.seg{display:flex;background:var(--card);border-radius:999px;padding:5px;gap:2px;box-shadow:0 2px 10px rgba(74,58,53,.10);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto}
.seg button{border:0;background:transparent;font:800 12.5px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--dark);color:#FFF6E8}
.right{display:flex;gap:8px;justify-content:flex-end;flex-wrap:nowrap}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 8px rgba(74,58,53,.10);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.icon:hover{transform:translateY(-1px)}
.icon svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon b{font:800 17px var(--f-body)}

.card{width:100%;flex:1 1 auto;min-height:0;max-width:760px;margin:14px auto 0;background:var(--card);border-radius:28px;padding:22px;box-shadow:0 10px 30px rgba(74,58,53,.08);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px}
.palco{flex:1 1 0;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden} /* espaço livre do tabuleiro */
.board{--n:6;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:clamp(4px,1.2vw,9px);width:var(--lado,min(100%,540px));height:var(--lado,auto);aspect-ratio:1;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cell{position:relative;border:0;padding:0;border-radius:clamp(7px,1.6vw,12px);cursor:pointer;display:grid;place-items:center;transition:filter .15s,transform .12s;overflow:visible}
.cell:hover{filter:brightness(1.04)}
.cell:active{transform:scale(.96)}
.cell svg.x{width:42%;height:42%;fill:none;stroke:rgba(60,40,35,.42);stroke-width:3;stroke-linecap:round}
.cell svg.bird{position:absolute;inset:4%;width:92%;height:92%;filter:drop-shadow(0 2px 2px rgba(60,40,35,.18));animation:pouso .38s cubic-bezier(.3,1.6,.5,1)}
.cell.given{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75)}
.cell.given::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.28)}
.cell.bad{animation:sacode .4s}
.cell.bad::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--bad);opacity:.5}
.cell.hint{box-shadow:0 0 0 4px var(--sun);z-index:1}
@keyframes pouso{from{transform:translateY(-35%) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes sacode{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.status{width:min(100%,620px);border:1px solid var(--line);border-radius:999px;padding:12px 18px;text-align:center;font-weight:800;font-size:14px;color:var(--ink);min-height:46px}
.opts{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.opts input{width:17px;height:17px;accent-color:var(--dark)}

.overlay{position:fixed;inset:0;background:rgba(59,44,40,.4);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);border-radius:26px;max-width:430px;width:100%;padding:24px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(59,44,40,.25);animation:sobe .3s ease-out}
@keyframes sobe{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal .head{display:flex;gap:14px;align-items:center}
.modal .head svg{width:96px;height:96px;flex:0 0 auto}
.modal h3{font:800 25px/1.1 var(--f-display);margin:0;color:var(--dark)}
.sci{font-style:italic;color:var(--muted);font-size:13.5px}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#FCEBD2;color:#8A4B12;margin-top:6px}
.badge.risk{background:#FBDDE0;color:#9B1F2C}
.modal ul{margin:0;padding-left:18px;line-height:1.6}
.res{font-weight:800;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:0;background:#F1EADF;font:800 14px var(--f-body);padding:11px 18px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--dark);color:#FFF6E8}
.album{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fig{background:#F7F2E7;border-radius:18px;padding:10px;text-align:center;font-size:12.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fig svg{width:64px;height:64px}
.fig.locked svg{filter:grayscale(1) brightness(.5);opacity:.3}
.fig.locked span{color:var(--muted)}
.modal p{margin:0;line-height:1.55}

@media (max-width:720px){
  .top{grid-template-columns:1fr auto;grid-template-areas:"l r" "c c"}
  .left{grid-area:l;flex-direction:column;align-items:flex-start}.right{grid-area:r}.center{grid-area:c}
  h1{font-size:28px}
  .card{padding:14px;border-radius:22px}
}
@media (max-width:420px){
  .icon{width:36px;height:36px}.right{gap:5px}.icon svg{width:16px;height:16px}
  .pill{font-size:15px}.pill svg{width:26px;height:26px}
  .seg button{padding:8px 10px;font-size:11.5px}
}
/* tutorial animado (tabuleiro 4x4 de demonstração com um "dedo" mostrando os toques) */
.tut{display:flex;flex-direction:column;gap:12px}
.tut-nuts{display:flex;gap:4px;justify-content:center}
.tut-nuts svg{width:22px;height:22px;transition:opacity .3s,transform .3s}
.tut-nuts svg.gone{opacity:.2;transform:scale(.75)}
.tut-board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(68vw,250px);aspect-ratio:1;margin:0 auto;pointer-events:none}
.tut-board .cell{cursor:default;transition:filter .25s,transform .25s,box-shadow .25s}
.tut-board .cell.brilha{filter:brightness(1.12);transform:scale(1.06);box-shadow:0 0 0 3px #fff}
.tut-txt{text-align:center;font-weight:800;min-height:3.2em;margin:0;display:flex;align-items:center;justify-content:center}
.dedo{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid var(--dark);opacity:.4;transition:left .35s ease,top .35s ease;z-index:2}
.dedo.bate{animation:toque .45s ease-out}
.dedo.bate2{animation:toque2 .7s ease-out}
@keyframes toque{0%{opacity:.4;transform:scale(1.3)}30%{opacity:1;transform:scale(.75)}100%{opacity:.4;transform:scale(1)}}
@keyframes toque2{0%{opacity:.4;transform:scale(1.3)}20%{opacity:1;transform:scale(.75)}40%{opacity:.7;transform:scale(1.05)}60%{opacity:1;transform:scale(.75)}100%{opacity:.4;transform:scale(1)}}
@media (max-height:780px){ /* telas baixas: sobra mais altura para o tabuleiro (a página não rola) */
  .brandbar{margin-bottom:8px;padding-bottom:8px}
  .eyebrow{display:none}
  h1{font-size:23px}
  .top{gap:8px}
  .card{margin-top:10px;padding:10px;gap:8px}
  .status{padding:7px 14px;min-height:0;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.modal .opts{font-size:15px;color:var(--ink);margin:2px 0}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 0}
.links a,.links button{border:0;background:none;padding:6px 0;color:#1E6FBF;font:800 14px var(--f-body);text-decoration:underline;cursor:pointer}
.idioma{margin-left:auto}
.modal a{color:#1E6FBF;font-weight:800}
@keyframes piscar{0%,22%,46%,100%{transform:none}9%,13%,33%,37%{transform:translateY(16.2px)}}
.canta .lid{animation:piscar .9s ease-in-out .38s}
.modal .head svg .lid{animation:piscar 3.4s ease-in-out .5s infinite}
.bico{transform-box:view-box;transform-origin:53.75px 49.4px}
@keyframes bicar{0%,22%,27%,46%,52%,100%{transform:none}6%,17%,32%,41%,58%,88%{transform:rotate(10deg)}}
.canta .bico{animation:bicar .63s ease-in-out .35s}
.fundo{opacity:0} /* fundo da boca só existe enquanto canta; parado, a borda dele vazaria em volta da mandíbula */
@keyframes fundo{from,to{opacity:1}}
.canta .fundo{animation:fundo .63s .35s}
/* vitória: as araras decolam das casas e a da espécie vem voando até a câmera */
@keyframes decola{0%{transform:none}25%{transform:translateY(8%) scale(1.05)}100%{transform:translate(25%,-180%) rotate(-14deg) scale(.6);opacity:0}}
.cell svg.bird.decola{animation:decola .75s ease-in forwards}
.voo{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,0) 30%,rgba(108,180,220,.35));animation:ceu 2.2s forwards}
@keyframes ceu{0%,100%{opacity:0}20%,80%{opacity:1}}
.voo .ave{position:absolute;left:50%;top:55%;width:min(46vw,240px);aspect-ratio:1;animation:rumo 2.2s cubic-bezier(.7,0,.95,.6) forwards}
@keyframes rumo{0%{transform:translate(-50%,-50%) scale(.08);opacity:0}10%,85%{opacity:1}100%{transform:translate(-50%,-50%) translate(18vw,-6vh) scale(6);opacity:0}}
.voo .bob,.voo .lado{position:absolute;inset:0}
.voo .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{from{translate:0 -4%}to{translate:0 4%}}
.voo .lado.esq{transform:scaleX(-1)} /* a asa esquerda é a direita espelhada no meio da ave */
.voo .asa{position:absolute;left:52%;top:58%;width:115%;height:auto;transform-origin:2% 50%;animation:bate .14s ease-in-out infinite alternate}
@keyframes bate{from{transform:rotate(-38deg)}to{transform:rotate(22deg)}}
.voo .bob>svg{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>

<div class="brandbar">
  <div class="logo" id="logo"></div>
  <div><b>Ararakú</b><small data-t="sub">Araras do Brasil</small></div>
  <div class="seg idioma" id="idioma" role="group" aria-label="Language / Idioma"><button data-lang="en">EN</button><button data-lang="pt">PT</button></div>
  <button class="icon" id="bMenu" data-ta="settings" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg></button>
</div>

<div class="top">
  <div class="left">
    <div class="pill" data-ta="placed" title="Araras pousadas"><span id="pillBird"></span><span><span class="num" id="placed">0</span>/<span id="total">6</span></span></div>
    <div class="pill lives" id="lives" data-ta="lives" title="Castanhas (vidas)"></div>
  </div>
  <div class="center">
    <h1 id="title">Fase 1</h1>
    <div class="eyebrow" data-t="biome">Bioma</div>
    <div class="seg" id="biomes" role="group" data-tl="biome" aria-label="Bioma"></div>
  </div>
  <div class="right">
    <button class="icon" id="bAlbum" data-ta="album" aria-label="Álbum de espécies" title="Álbum"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
    <button class="icon" id="bHint" data-ta="hint" aria-label="Dica" title="Dica"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
    <button class="icon" id="bUndo" data-ta="undo" aria-label="Desfazer" title="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="icon" id="bRestart" data-ta="restart" aria-label="Reiniciar" title="Reiniciar"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/></svg></button>
    <button class="icon" id="bRules" data-ta="rules" aria-label="Como jogar" title="Como jogar"><b>?</b></button>
  </div>
</div>

<main class="card">
  <div class="palco" id="palco"><div class="board" id="board" role="grid" data-tl="board" aria-label="Tabuleiro"></div></div>
  <div class="status" id="msg" aria-live="polite">Toque para marcar com X. Toque duas vezes para pousar a arara.</div>
</main>

<div class="voo" id="voo" hidden aria-hidden="true"></div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
/* ---------- Idioma: inglês por padrão; português se o aparelho estiver em português ou se a pessoa escolher ---------- */
let LANG=(()=>{try{const v=JSON.parse(localStorage.getItem('araraku-lang'));if(v==='pt'||v==='en')return v}catch(e){}return /^pt/i.test(navigator.language||'')?'pt':'en'})();
const L=o=>o&&typeof o==='object'&&'pt' in o?o[LANG]:o; // campo bilíngue {pt,en} -> texto do idioma atual
const TXT={
  pt:{sub:'Araras do Brasil',placed:'Araras pousadas',lives:'Castanhas (vidas)',biome:'Bioma',album:'Álbum de espécies',hint:'Dica',undo:'Desfazer',restart:'Reiniciar',rules:'Como jogar',board:'Tabuleiro',
    autoX:'Marcar X automático em volta de cada arara',sfx:'Efeitos sonoros',music:'Música de fundo',allGames:'Todos os jogos',privacy:'Privacidade e suporte',settings:'Ajustes',gotIt:'Entendi',replay:'Ver de novo',tutLink:'Ver o tutorial',
    tut:['Cada cor é uma árvore. Cada árvore recebe exatamente uma arara.','Toque uma vez para marcar X onde a arara não pode ficar.','Toque duas vezes para pousar a arara.','Só uma por linha e por coluna, e nunca encostadas, nem na diagonal.','Errou? Perde uma castanha. São três por fase.','Complete todas as árvores e as araras voam livres!'],

/* ---------- RNG com semente ---------- */
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const shuffle=(arr,r)=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};

/* ---------- Gerador de fases com solução única ---------- */
function placeBirds(n,r){
  const sol=[],used=new Array(n).fill(false);
  (function bt(row){
    if(row===n)return true;
    for(const c of shuffle([...Array(n).keys()],r)){
      if(used[c])continue; if(row>0&&Math.abs(sol[row-1]-c)<2)continue;
      used[c]=true;sol[row]=c; if(bt(row+1))return true; used[c]=false;
    }return false;
  })(0);
  return sol;
}
function growRegions(n,sol,r){
  const g=Array.from({length:n},()=>new Array(n).fill(-1));
  sol.forEach((c,row)=>g[row][c]=row);
  let left=n*n-n; const D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(left>0){
    const reg=Math.floor(r()*n); const front=[];
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(g[i][j]===reg)for(const[di,dj]of D){const a=i+di,b=j+dj;if(a>=0&&b>=0&&a<n&&b<n&&g[a][b]===-1)front.push([a,b])}
    if(!front.length)continue;
    const[a,b]=front[Math.floor(r()*front.length)]; g[a][b]=reg; left--;
  }
  return g;
}
function countSolutions(n,g,givens,limit=2){
  let count=0; const usedC=new Array(n).fill(false),usedR=new Array(n).fill(false),cur=[];
  (function bt(row){
    if(count>=limit)return;
    if(row===n){count++;return}
    const cols=givens[row]!=null?[givens[row]]:[...Array(n).keys()];
    for(const c of cols){
      const reg=g[row][c];
      if(usedC[c]||usedR[reg])continue; if(row>0&&Math.abs(cur[row-1]-c)<2)continue;
      usedC[c]=usedR[reg]=true;cur[row]=c;bt(row+1);usedC[c]=usedR[reg]=false;
    }
  })(0);
  return count;
}
function connected(n,g,reg){
  let start=null,total=0;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(g[i][j]===reg){total++;if(!start)start=[i,j]}
  if(!start)return false;
  const seen=new Set([start+'']),st=[start];
  while(st.length){const[i,j]=st.pop();for(const[a,b]of[[i+1,j],[i-1,j],[i,j+1],[i,j-1]]){if(a>=0&&b>=0&&a<n&&b<n&&g[a][b]===reg&&!seen.has(a+','+b)){seen.add(a+','+b);st.push([a,b])}}}
  return seen.size===total;
}
function refine(n,g,sol,r){
  // ajusta as bordas das árvores até sobrar uma única solução
  const none=new Array(n).fill(null);
  let cnt=countSolutions(n,g,none,60);
  for(let it=0;it<1500&&cnt>1;it++){
    const i=Math.floor(r()*n),j=Math.floor(r()*n); if(sol[i]===j)continue;
    const nb=[[i+1,j],[i-1,j],[i,j+1],[i,j-1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&g[a][b]!==g[i][j]);
    if(!nb.length)continue;
    const[a,b]=nb[Math.floor(r()*nb.length)],from=g[i][j];
    g[i][j]=g[a][b];
    if(!connected(n,g,from)){g[i][j]=from;continue}
    const c=countSolutions(n,g,none,60);
    if(c<=cnt)cnt=c; else g[i][j]=from;
  }
  return cnt;
}
function generate(n,seed){
  const r=rngFrom(seed); let last;
  for(let t=0;t<40;t++){
    const sol=placeBirds(n,r),g=growRegions(n,sol,r);
    const givens=new Array(n).fill(null);
    if(refine(n,g,sol,r)===1){
      // uma arara inicial para começar, como no original
      const gr=Math.floor(r()*n); givens[gr]=sol[gr];
      return {n,g,sol,givens};
    }
    last={sol,g};
  }
  const {sol,g}=last,givens=new Array(n).fill(null);
  for(const row of shuffle([...Array(n).keys()],r)){givens[row]=sol[row];if(countSolutions(n,g,givens)===1)break}
  return {n,g,sol,givens};
}

let ac,som=store.get('araraku-som',true),musica=store.get('araraku-musica',true);
function audio(){ // o navegador só libera áudio depois de um toque
  try{
    if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();ruido=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=ruido.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(ac.state==='suspended'&&!document.hidden)ac.resume();return ac
  }catch(e){return null}
}
function cantar(k){
  if(!som||!audio())return;
  const tom={azul:1,caninde:1.12,vermelha:.9,lear:1.22}[k]||1,t0=ac.currentTime+.35; // cada espécie num tom; canta depois do pouso
  if(mGain){mGain.gain.setTargetAtTime(.1,ac.currentTime,.05);mGain.gain.setTargetAtTime(VOL_M,t0+.7,.2)} // a música abaixa pra arara aparecer
  for(const[dt,dur,f1,f2]of[[0,.14,1500,2500],[.17,.12,1700,2800],[.33,.3,2700,1300]]){ // piu, piu, piiuu
    const t=t0+dt,o=ac.createOscillator(),g=ac.createGain(),vib=ac.createOscillator(),vg=ac.createGain();
    o.type='triangle';o.frequency.setValueAtTime(f1*tom,t);o.frequency.exponentialRampToValueAtTime(f2*tom,t+dur);
    vib.frequency.value=30;vg.gain.value=70*tom;vib.connect(vg).connect(o.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.015);g.gain.setValueAtTime(.18,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);vib.start(t);o.stop(t+dur+.03);vib.stop(t+dur+.03);
  }
}

/* Musiquinha de fundo: bossinha de marimba, 100 bpm, 8 compassos (C Am Dm G C Am F G) em laço */
const VOL_M=.6,COLCHEIA=.3;
const ACORDES=[[48,[64,67,71]],[45,[64,67,72]],[50,[65,69,72]],[43,[65,71,74]],[48,[64,67,71]],[45,[64,67,72]],[41,[64,69,72]],[43,[65,71,74]]];
const MELODIA=[[76,0,79,0,81,79,76,0],[72,0,76,0,74,72,69,0],[74,0,77,0,81,0,79,77],[76,74,0,71,0,74,0,0],
  [76,0,79,0,84,0,81,79],[81,0,79,76,0,74,0,72],[81,0,79,0,77,76,0,74],[74,0,0,76,74,71,0,0]];
let mGain,ruido,passo=0,proxT=0,relogio=0;
function nota(m,t,dur,vol,tipo='sine'){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=tipo;o.frequency.value=440*2**((m-69)/12);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(mGain);o.start(t);o.stop(t+dur+.02);
}
function chocalho(t,vol){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=ruido;f.type='highpass';f.frequency.value=6000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  s.connect(f).connect(g).connect(mGain);s.start(t);s.stop(t+.06);
}
function tocarPasso(n,t){
  const c=n%8,[baixo,acorde]=ACORDES[(n>>3)%8],m=MELODIA[(n>>3)%8][c],eco=(n>>6)%2; // volta sim, volta não: melodia em eco, uma oitava acima
  if(c===0||c===4)nota(c?baixo+7:baixo,t,.5,.25,'triangle'); // baixo: tônica e quinta
  if(c===0||c===3||c===6)for(const a of acorde)nota(a,t,.25,.05); // acorde no 3-3-2
  if(m){nota(m+(eco?12:0),t,.6,eco?.09:.18);nota(m+(eco?36:24),t,.12,eco?.03:.05)} // marimba: fundamental + harmônico curto
  chocalho(t,c%2?.04:.02);
}
function iniciarMusica(){
  if(!musica||relogio||!audio())return;
  if(!mGain){mGain=ac.createGain();mGain.gain.value=VOL_M;mGain.connect(ac.destination)}
  proxT=Math.max(proxT,ac.currentTime+.1);
  relogio=setInterval(()=>{while(proxT<ac.currentTime+.3){tocarPasso(passo++,proxT);proxT+=COLCHEIA}},60); // agenda 0,3 s à frente
}
function pararMusica(){clearInterval(relogio);relogio=0}

/* Erro: "ops" (duas notas descendo); sem castanhas: trombone triste */
function tremer(tipo){ // vibração do iPhone: só existe no app; no navegador não faz nada
  const h=window.Capacitor?.Plugins?.Haptics;if(!h)return;
  (tipo==='acerto'?h.impact({style:'LIGHT'}):h.notification({type:tipo==='erro'?'ERROR':'SUCCESS'})).catch(()=>{});
}
function errar(fim){
  if(!som||!audio())return;
  const t0=ac.currentTime+.02,notas=fim?[[0,.28,311],[.3,.28,294],[.6,.28,277],[.9,.9,262]]:[[0,.13,494],[.17,.28,392]];
  if(mGain){mGain.gain.setTargetAtTime(.1,ac.currentTime,.03);mGain.gain.setTargetAtTime(VOL_M,t0+(fim?2:.6),.3)}
  for(const[dt,dur,f]of notas){
    const t=t0+dt,o=ac.createOscillator(),filtro=ac.createBiquadFilter(),g=ac.createGain(),vol=fim?.1:.09;
    o.type=fim?'sawtooth':'square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.94,t+dur); // cai um pouquinho no fim
    if(dur>.5){const v=ac.createOscillator(),vg=ac.createGain();v.frequency.value=6;vg.gain.value=7;v.connect(vg).connect(o.frequency);v.start(t);v.stop(t+dur+.03)} // nota final tremida
    filtro.type='lowpass';filtro.frequency.value=fim?1400:1800; // tira o chiado do timbre de videogame
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(filtro).connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.03);
  }
}

let gerando=0;
function load(biome,level){
  // ponytail: gera na thread principal (até ~4 s no celular na Caatinga 8x8); avisa e só gera depois de pintar. Web Worker se ficar lento demais
  const tk=++gerando;
  S.biome=biome;S.level=level;S.done=true;S.history=[];
  say(tx('preparing'));$('board').style.opacity=.4;
  requestAnimationFrame(()=>setTimeout(()=>{
    if(tk!==gerando)return; // trocou de fase antes de gerar
    const n=biome.n; S.puzzle=generate(n,hashStr(biome.id+'-'+level));
    S.marks=Array.from({length:n},()=>new Array(n).fill(0));
    S.puzzle.givens.forEach((c,r)=>{if(c!=null)S.marks[r][c]=2});
    S.lives=3;S.start=Date.now();S.done=false;
    $('board').style.opacity='';
    renderAll();
  }));
}
function regionColor(id){return S.biome.pal[id%S.biome.pal.length]}
function renderBoard(){
  const {n,g,givens}=S.puzzle,b=$('board');
  b.style.setProperty('--n',n);b.innerHTML='';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){

    el.className='cell'+(givens[i]===j?' given':'');el.dataset.r=i;el.dataset.c=j;el.setAttribute('role','gridcell');
    el.style.background=regionColor(g[i][j]);paint(el,i,j);b.appendChild(el);

}
function paint(el,i,j){
  const m=S.marks[i][j];
  el.innerHTML=m===2?bird(S.biome.sp):m===1?'<svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>':'';
  el.setAttribute('aria-label',tx('cell')(i+1,j+1,m));
}
const cellEl=(i,j)=>$('board').children[i*S.puzzle.n+j];
function count(){let c=0;for(const r of S.marks)for(const v of r)if(v===2)c++;$('placed').textContent=c;$('total').textContent=S.puzzle.n;return c}
function renderLives(){$('lives').innerHTML=[0,1,2].map(k=>NUT.replace('<svg',`<svg class="${k<S.lives?'':'gone'}"`)).join('')}
function renderAll(){
  $('biomes').innerHTML=BIOMES.map(b=>`<button data-b="${b.id}" aria-pressed="${S.biome.id===b.id}">${L(b.nome)}</button>`).join('');
  $('title').textContent=tx('level')(S.level);

/* ---------- Jogadas ---------- */
function setMark(i,j,v){const p=S.marks[i][j];if(p===v)return false;S.history.push([[i,j,p]]);S.marks[i][j]=v;paint(cellEl(i,j),i,j);return true}
function tryPlace(i,j){
  if(S.done||S.puzzle.givens[i]===j)return;
  if(S.puzzle.sol[i]!==j){
    S.lives--;renderLives();errar(S.lives<=0);tremer('erro');
    const el=cellEl(i,j);el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),600);
    say(why(i,j));if(S.lives<=0)lose();return;
  }
  const step=[[i,j,S.marks[i][j]]];S.marks[i][j]=2;paint(cellEl(i,j),i,j);
  cellEl(i,j).querySelector('svg').classList.add('canta');cantar(S.biome.sp);tremer('acerto');
  if(autoX){const{n,g}=S.puzzle;
    for(let a=0;a<n;a++)for(let b=0;b<n;b++){if(S.marks[a][b])continue;
      if(a===i||b===j||g[a][b]===g[i][j]||(Math.abs(a-i)<2&&Math.abs(b-j)<2)){step.push([a,b,0]);S.marks[a][b]=1;paint(cellEl(a,b),a,b)}}}
  S.history.push(step);
  say(tx('landed')(i+1,j+1));
  if(count()===S.puzzle.n)win();
}
function why(i,j){
  const{n,g}=S.puzzle;
  for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(S.marks[a][b]===2){
    if(a===i)return tx('row');
    if(b===j)return tx('col');
    if(g[a][b]===g[i][j])return tx('tree');
    if(Math.abs(a-i)<2&&Math.abs(b-j)<2)return tx('touch');
  }
  return tx('nope');
}
function undo(){const st=S.history.pop();if(!st||S.done)return;for(const[i,j,p]of st){S.marks[i][j]=p;paint(cellEl(i,j),i,j)}count();say(tx('undone'))}
function hint(){
  if(S.done)return;const{n,g,sol}=S.puzzle;let best=null,bf=99;
  for(let reg=0;reg<n;reg++){const r=sol.findIndex((c,x)=>g[x][c]===reg);if(S.marks[r][sol[r]]===2)continue;
    let f=0;for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(g[a][b]===reg&&S.marks[a][b]===0)f++;
    if(f<bf){bf=f;best=[r,sol[r]]}}
  if(!best)return;const el=cellEl(...best);el.classList.add('hint');setTimeout(()=>el.classList.remove('hint'),2200);
  say(tx('hintMsg'));
}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function modal(html){$('modal').innerHTML=html;$('overlay').hidden=false}
function close(){$('overlay').hidden=true}
function asas(n){ // bater de asas: sopros de ruído filtrado, um por batida
  if(!som||!audio())return;
  for(let k=0;k<n;k++){
    const t=ac.currentTime+k*.28,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=ruido;s.loop=true;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(1400,t+.12);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
    s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+.15);
  }
}
function voar(sp,depois){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return depois();
  const tk=gerando,v=$('voo');
  setTimeout(()=>{ // a última arara termina de cantar e todas decolam
    $('board').querySelectorAll('svg.bird').forEach((b,k)=>{b.style.animationDelay=k*.07+'s';b.classList.add('decola')});asas(4);
  },1000);
  setTimeout(()=>{ // a da espécie vem voando até a câmera, cantando
    v.innerHTML=`<div class="ave"><div class="bob"><div class="lado esq"><img class="asa" src="${SPECIES[sp].asa}" alt=""></div><div class="lado dir"><img class="asa" src="${SPECIES[sp].asa}" alt=""></div>${bird(sp,'canta')}</div></div>`;
    v.hidden=false;cantar(sp);asas(8);
  },1500);
  setTimeout(()=>{v.hidden=true;v.innerHTML='';if(tk===gerando)depois()},3700); // trocou de fase no meio: não abre a ficha velha
}
function win(){
  S.done=true;const sp=S.biome.sp,isNew=!unlocked.includes(sp);
  if(isNew){unlocked.push(sp);store.set('araraku-album',unlocked)}
  progress[S.biome.id]=Math.max(progress[S.biome.id]||1,S.level+1);store.set('araraku-progress',progress);
  const s=SPECIES[sp],t=Math.round((Date.now()-S.start)/1000);
  say(tx('free'));tremer('vitoria');
  voar(sp,()=>{modal(`<div class="head">${bird(sp,'')}<div><h3>${L(s.nome)}</h3><div class="sci">${s.cient}</div><span class="badge ${s.risk?'risk':''}">${L(s.status)}</span></div></div>
    <div class="res">${isNew?tx('newSp'):''}${tx('result')(S.level,fmt(t),S.lives)}</div>
    <ul>${L(s.fatos).map(f=>`<li>${f}</li>`).join('')}</ul>
    <div class="row"><button class="btn" id="mAgain">${tx('again')}</button><button class="btn primary" id="mNext">${tx('next')}</button></div>`);
  $('mNext').onclick=()=>{close();load(S.biome,S.level+1)};$('mAgain').onclick=()=>{close();load(S.biome,S.level)};});
}
function lose(){
  S.done=true;
  modal(`<h3>${tx('loseT')}</h3><p>${tx('loseP')}</p>
    <div class="row"><button class="btn primary" id="mRetry">${tx('retry')}</button></div>`);
  $('mRetry').onclick=()=>{close();load(S.biome,S.level)};
}
function album(){

    <div class="album">${Object.entries(SPECIES).map(([k,s])=>{const ok=unlocked.includes(k);return`<div class="fig ${ok?'':'locked'}">${bird(k,'')}<span>${ok?L(s.nome):'???'}</span></div>`}).join('')}</div>

/* ---------- Tutorial animado: 4x4 de demonstração em loop, até tocar em "Entendi" ---------- */
const TUT={n:4,sol:[1,3,0,2],g:[[0,0,1,1],[0,2,2,1],[3,2,2,1],[3,3,2,1]],pal:['#A9D88F','#6CB4DC','#E6C84E','#DA94B2']};
const XSVG='<svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
let tutTk=0;
function tutorial(){
  const tk=++tutTk;
  modal(`<div class="tut"><h3>${tx('rules')}</h3>
    <div class="tut-nuts" id="tutN"></div>
    <div class="tut-board" id="tutB"></div>
    <p class="tut-txt" id="tutT" aria-live="polite"></p>
    <div class="row"><button class="btn" id="tutDe">${tx('replay')}</button><button class="btn primary" id="tutOk">${tx('gotIt')}</button></div></div>`);
  $('overlay').dataset.fixo='1'; // tocar fora não fecha: só o "Entendi"
  $('tutOk').onclick=()=>{store.set('araraku-tutorial',true);tutTk++;delete $('overlay').dataset.fixo;close()};
  $('tutDe').onclick=tutorial;
  rodarTutorial(tk);
}
async function rodarTutorial(tk){
  const zz=ms=>new Promise(r=>setTimeout(r,ms)),vivo=()=>tk===tutTk&&$('tutB');
  const {n,g,sol,pal}=TUT;
  while(vivo()){
    const B=$('tutB'),T=$('tutT'),N=$('tutN');B.innerHTML='';
    N.innerHTML=[0,1,2].map(()=>NUT).join('');
    const cel=[];
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){const c=document.createElement('div');c.className='cell';c.style.background=pal[g[i][j]];B.appendChild(c);cel.push(c)}
    const C=(i,j)=>cel[i*n+j],dedo=document.createElement('div');dedo.className='dedo';B.appendChild(dedo);
    const fala=k=>{T.textContent=tx('tut')[k]};
    const toca=async(i,j,duas)=>{const c=C(i,j);dedo.style.left=c.offsetLeft+c.offsetWidth/2+'px';dedo.style.top=c.offsetTop+c.offsetHeight/2+'px';
      await zz(380);dedo.classList.remove('bate','bate2');void dedo.offsetWidth;dedo.classList.add(duas?'bate2':'bate');await zz(duas?650:420)};
    const pousa=(i,j)=>{C(i,j).innerHTML=bird('azul','bird canta')};
    // 1. cada cor é uma árvore
    fala(0);await zz(600);
    for(let r=0;r<n&&vivo();r++){cel.forEach((c,k)=>c.classList.toggle('brilha',g[k/n|0][k%n]===r));await zz(650)}
    cel.forEach(c=>c.classList.remove('brilha'));if(!vivo())return;
    // 2. toque marca X
    fala(1);await zz(500);await toca(0,0);C(0,0).innerHTML=XSVG;await zz(300);await toca(1,0);C(1,0).innerHTML=XSVG;await zz(700);if(!vivo())return;
    // 3. toque duplo pousa
    fala(2);await zz(500);await toca(0,sol[0],true);pousa(0,sol[0]);await zz(1300);if(!vivo())return;
    // 4. linha, coluna e vizinhas
    fala(3);await zz(400);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(!vivo())return;if(C(i,j).innerHTML)continue;
      if(i===0||j===sol[0]||(Math.abs(i)<2&&Math.abs(j-sol[0])<2)){C(i,j).innerHTML=XSVG;await zz(140)}}
    await zz(1200);if(!vivo())return;
    // 5. erro custa castanha
    fala(4);await zz(400);await toca(2,2,true);
    C(2,2).classList.add('bad');N.children[2].classList.add('gone');await zz(700);C(2,2).classList.remove('bad');await zz(900);if(!vivo())return;
    // 6. completa e voam
    fala(5);await zz(300);
    for(const i of [1,2,3]){if(!vivo())return;await toca(i,sol[i],true);pousa(i,sol[i]);await zz(350)}
    await zz(900);B.querySelectorAll('svg.bird').forEach((b,k)=>{b.style.animationDelay=k*.08+'s';b.classList.add('decola')});dedo.style.opacity=0;
    await zz(2200);
  }
}

/* ---------- Eventos ---------- */
let last={k:'',t:0};
$('board').addEventListener('click',e=>{
  const el=e.target.closest('.cell');if(!el||S.done)return;
  const i=+el.dataset.r,j=+el.dataset.c,k=i+','+j,now=Date.now();
  if(last.k===k&&now-last.t<330){
    if(last.rec){S.history.pop();S.marks[i][j]=last.prev;paint(el,i,j)}
    last={k:'',t:0};
    if(S.marks[i][j]!==2)tryPlace(i,j);return;
  }
  const prev=S.marks[i][j];let rec=false;
  if(prev===2){if(S.puzzle.givens[i]!==j){rec=setMark(i,j,0);count();say(tx('removed'))}}
  else rec=setMark(i,j,prev===1?0:1);
  last={k,t:now,rec,prev};
});
$('biomes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const bm=BIOMES.find(x=>x.id===b.dataset.b);load(bm,progress[bm.id]||1)});
$('bUndo').onclick=undo;$('bHint').onclick=hint;$('bRestart').onclick=()=>load(S.biome,S.level);
$('bAlbum').onclick=album;$('bRules').onclick=rules;$('bMenu').onclick=ajustes;
addEventListener('pointerup',iniciarMusica);addEventListener('keydown',iniciarMusica); // começa no primeiro toque (pointerup libera áudio no iPhone)
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()}); // aba escondida: silêncio
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&!S.done&&!$('overlay').dataset.fixo)close()});
$('logo').innerHTML=bird('azul','');
$('idioma').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.lang===LANG)return;LANG=b.dataset.lang;store.set('araraku-lang',LANG);traduzir();if(S.puzzle&&!S.done)renderAll()});
traduzir();
// tabuleiro: o maior quadrado que cabe no espaço livre (a página não rola)
new ResizeObserver(()=>{const r=$('palco').getBoundingClientRect();$('board').style.setProperty('--lado',Math.floor(Math.min(r.width,r.height,560))+'px')}).observe($('palco'));
load(BIOMES[1],progress.cerrado||1);
if(!store.get('araraku-tutorial',false))tutorial(); // só na primeira vez; depois, pelos Ajustes
</script>
